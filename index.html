<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Agenda pessoal de compromissos, prazos e calendário. Funciona offline e salva os dados no próprio dispositivo.">
<meta name="theme-color" content="#0a0c11">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Minha Agenda</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<style>
  :root{
    --bg:#0a0c11;
    --bg-soft:#10131a;
    --panel:#141822;
    --panel-2:#1a1f2b;
    --border:rgba(255,255,255,.07);
    --border-strong:rgba(255,255,255,.13);
    --text:#e8ebf2;
    --muted:#8b93a7;
    --faint:#5b6376;
    --accent:#7c6cff;
    --accent-2:#22d3ee;

    --c-low:#4ade80;
    --c-med:#facc15;
    --c-high:#fb923c;
    --c-crit:#f87171;
    --c-late:#f45b5b;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    background:
      radial-gradient(900px 500px at 12% -8%, rgba(124,108,255,.16), transparent 60%),
      radial-gradient(800px 500px at 92% 4%, rgba(34,211,238,.10), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Ubuntu,sans-serif;
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100%;
  }

  .wrap{max-width:1080px;margin:0 auto;padding:28px 20px 90px}

  /* ---------- Header ---------- */
  header{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}

  .brand h1{
    font-size:26px;font-weight:700;letter-spacing:-.5px;
    background:linear-gradient(92deg,var(--accent),var(--accent-2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand p{color:var(--muted);font-size:13px;margin-top:3px}

  .actions{display:flex;gap:8px;flex-wrap:wrap}

  .btn{
    appearance:none;border:1px solid var(--border-strong);
    background:var(--panel);color:var(--text);
    padding:9px 14px;border-radius:10px;
    font:inherit;font-size:13.5px;font-weight:500;
    cursor:pointer;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--panel-2);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{
    background:linear-gradient(135deg,var(--accent),#5b4bdb);
    border-color:transparent;color:#fff;font-weight:600;
    box-shadow:0 6px 18px rgba(124,108,255,.32);
  }
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}

  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:4px;background:var(--bg-soft);border:1px solid var(--border);padding:4px;border-radius:12px;width:fit-content;margin-bottom:20px}
  .tab{
    appearance:none;border:0;background:transparent;color:var(--muted);
    padding:8px 18px;border-radius:9px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:.15s;
  }
  .tab:hover{color:var(--text)}
  .tab[aria-selected="true"]{background:var(--panel-2);color:var(--text);box-shadow:0 1px 0 rgba(255,255,255,.05) inset}

  /* ---------- Next up card ---------- */
  .nextup{
    position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--panel),var(--bg-soft));
    border:1px solid var(--border);border-radius:16px;
    padding:20px 22px;margin-bottom:24px;
    display:flex;gap:18px;align-items:center;
  }
  .nextup::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--u,var(--accent));
  }
  .nextup .ring{
    flex:0 0 auto;width:56px;height:56px;border-radius:50%;
    display:grid;place-items:center;
    background:color-mix(in srgb, var(--u,var(--accent)) 16%, transparent);
    color:var(--u,var(--accent));font-size:21px;
    border:1px solid color-mix(in srgb, var(--u,var(--accent)) 35%, transparent);
  }
  .nextup .body{min-width:0;flex:1}
  .nextup .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--faint);font-weight:700}
  .nextup h3{font-size:19px;font-weight:650;letter-spacing:-.3px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nextup p{color:var(--muted);font-size:13.5px;margin-top:2px}
  .nextup .when{text-align:right;flex:0 0 auto}
  .nextup .when b{display:block;font-size:17px;font-weight:700;color:var(--u,var(--accent))}
  .nextup .when span{font-size:12.5px;color:var(--muted)}

  /* ---------- Filters ---------- */
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .search{
    flex:1;min-width:180px;
    background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    padding:9px 13px;border-radius:10px;font:inherit;font-size:14px;
  }
  .search::placeholder{color:var(--faint)}
  .search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.16)}
  .chip{
    appearance:none;border:1px solid var(--border-strong);background:var(--bg-soft);color:var(--muted);
    padding:8px 13px;border-radius:999px;font:inherit;font-size:13px;cursor:pointer;transition:.15s;
  }
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
  .chip[aria-pressed="true"]{background:rgba(124,108,255,.16);border-color:var(--accent);color:#cfc9ff}

  /* ---------- Day group ---------- */
  .day{margin-bottom:26px}
  .dayhead{display:flex;align-items:baseline;gap:10px;margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid var(--border)}
  .dayhead h2{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .dayhead .cnt{font-size:12px;color:var(--faint);font-weight:600}
  .dayhead.today h2{color:var(--accent-2)}
  .dayhead.late h2{color:var(--c-late)}

  /* ---------- Item ---------- */
  .item{
    display:flex;gap:14px;align-items:flex-start;
    background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--u);
    border-radius:12px;padding:14px 16px;margin-bottom:9px;
    transition:.15s;cursor:pointer;
  }
  .item:hover{background:var(--panel-2);border-color:var(--border-strong);border-left-color:var(--u);transform:translateX(2px)}
  .item.done{opacity:.45}
  .item.done .title{text-decoration:line-through}

  .time{
    flex:0 0 62px;text-align:center;
    background:color-mix(in srgb, var(--u) 13%, transparent);
    border-radius:9px;padding:7px 4px;
  }
  .time b{display:block;font-size:15px;font-weight:700;color:var(--u);line-height:1.2}
  .time span{display:block;font-size:10.5px;color:var(--muted);margin-top:1px}

  .content{flex:1;min-width:0}
  .title{font-size:15px;font-weight:600;letter-spacing:-.2px;word-break:break-word}
  .desc{font-size:13.5px;color:var(--muted);margin-top:3px;word-break:break-word;white-space:pre-wrap}

  .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;align-items:center}

  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:700;letter-spacing:.2px;
    padding:3.5px 9px;border-radius:999px;white-space:nowrap;
    background:color-mix(in srgb, var(--u) 15%, transparent);
    color:var(--u);
    border:1px solid color-mix(in srgb, var(--u) 32%, transparent);
  }
  .badge.pulse{animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  .tag{
    font-size:11.5px;font-weight:600;padding:3.5px 9px;border-radius:999px;
    background:color-mix(in srgb, var(--c) 14%, transparent);
    color:var(--c);border:1px solid color-mix(in srgb, var(--c) 30%, transparent);
  }
  .loc{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:4px}

  .tools{display:flex;gap:5px;flex:0 0 auto;opacity:0;transition:.15s}
  .item:hover .tools{opacity:1}
  .tool{
    appearance:none;border:1px solid var(--border);background:var(--bg-soft);color:var(--muted);
    width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:14px;line-height:1;
    display:grid;place-items:center;transition:.15s;
  }
  .tool:hover{color:var(--text);border-color:var(--border-strong);background:var(--panel-2)}
  .tool.del:hover{color:#ff7b7b;border-color:rgba(239,68,68,.5)}

  .check{
    flex:0 0 auto;width:19px;height:19px;margin-top:3px;
    border:2px solid var(--border-strong);border-radius:6px;background:transparent;
    cursor:pointer;appearance:none;position:relative;transition:.15s;
  }
  .check:checked{background:var(--c-low);border-color:var(--c-low)}
  .check:checked::after{
    content:'';position:absolute;left:5px;top:1.5px;width:5px;height:10px;
    border:solid #06240f;border-width:0 2.5px 2.5px 0;transform:rotate(45deg);
  }

  /* ---------- Calendar ---------- */
  .calbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .calbar h2{font-size:19px;font-weight:700;text-transform:capitalize;letter-spacing:-.3px}
  .calnav{display:flex;gap:6px}

  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px}
  .dow{text-align:center;font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.8px;padding:6px 0}

  .cell{
    aspect-ratio:1/.92;min-height:62px;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:7px;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;gap:5px;overflow:hidden;
  }
  .cell:hover{background:var(--panel-2);border-color:var(--border-strong)}
  .cell.out{opacity:.28}
  .cell.today{border-color:var(--accent);background:rgba(124,108,255,.09)}
  .cell .n{font-size:13.5px;font-weight:600;width:25px;height:25px;display:grid;place-items:center;border-radius:7px}
  .cell.today .n{background:var(--accent);color:#fff}
  .dots{display:flex;gap:3.5px;flex-wrap:wrap;justify-content:center;max-width:100%}
  .dot{width:6px;height:6px;border-radius:50%}
  .cell .more{font-size:9.5px;color:var(--faint);font-weight:700}

  /* ---------- Empty ---------- */
  .empty{text-align:center;padding:60px 20px;color:var(--faint)}
  .empty .ico{font-size:40px;margin-bottom:12px;opacity:.5}
  .empty h3{font-size:16px;color:var(--muted);font-weight:600;margin-bottom:5px}
  .empty p{font-size:13.5px}

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(4,6,10,.72);backdrop-filter:blur(5px);
    display:none;place-items:center;z-index:60;padding:20px;
  }
  .overlay.on{display:grid}
  .modal{
    background:var(--panel);border:1px solid var(--border-strong);border-radius:18px;
    width:100%;max-width:520px;padding:24px;box-shadow:0 28px 70px rgba(0,0,0,.6);
    animation:pop .2s cubic-bezier(.2,.9,.3,1.2);max-height:92vh;overflow-y:auto;
  }
  @keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal h3{font-size:18px;font-weight:700;margin-bottom:18px;letter-spacing:-.3px}

  label{display:block;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:6px}
  .field{margin-bottom:15px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  input[type=text],input[type=datetime-local],textarea,select{
    width:100%;background:var(--bg-soft);border:1px solid var(--border);color:var(--text);
    padding:11px 13px;border-radius:10px;font:inherit;font-size:14.5px;
  }
  textarea{resize:vertical;min-height:74px}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,108,255,.16)}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  select option{background:var(--panel)}

  .presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .preset{
    appearance:none;border:1px solid var(--border);background:var(--bg-soft);color:var(--muted);
    padding:5px 11px;border-radius:999px;font:inherit;font-size:12px;cursor:pointer;transition:.15s;
  }
  .preset[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c);color:var(--c);font-weight:600}

  .modalfoot{display:flex;gap:9px;justify-content:flex-end;margin-top:20px;padding-top:18px;border-top:1px solid var(--border)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(90px);
    background:var(--panel-2);border:1px solid var(--border-strong);color:var(--text);
    padding:11px 20px;border-radius:11px;font-size:13.5px;font-weight:500;
    box-shadow:0 14px 40px rgba(0,0,0,.55);opacity:0;transition:.28s;z-index:90;pointer-events:none;
  }
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:640px){
    .wrap{padding:20px 14px 80px}
    .nextup{flex-wrap:wrap;gap:12px}
    .nextup .when{text-align:left;width:100%;padding-left:74px;margin-top:-8px}
    .time{flex:0 0 52px}
    .tools{opacity:1}
    .cell{min-height:48px;padding:4px}
    .row{grid-template-columns:1fr}
  }

  /* Respeita o recorte da tela e a barra de gestos do Android */
  @supports(padding:max(0px)){
    .wrap{
      padding-top:calc(28px + env(safe-area-inset-top));
      padding-bottom:calc(90px + env(safe-area-inset-bottom));
      padding-left:max(20px, env(safe-area-inset-left));
      padding-right:max(20px, env(safe-area-inset-right));
    }
    #toast{bottom:calc(22px + env(safe-area-inset-bottom))}
    .overlay{
      padding-top:calc(20px + env(safe-area-inset-top));
      padding-bottom:calc(20px + env(safe-area-inset-bottom));
      padding-left:max(20px, env(safe-area-inset-left));
      padding-right:max(20px, env(safe-area-inset-right));
    }
  }
  @media(max-width:640px){
    @supports(padding:max(0px)){
      .wrap{
        padding-top:calc(20px + env(safe-area-inset-top));
        padding-bottom:calc(80px + env(safe-area-inset-bottom));
        padding-left:max(14px, env(safe-area-inset-left));
        padding-right:max(14px, env(safe-area-inset-right));
      }
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="storageWarn" hidden
       style="background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fca5a5;
              border-radius:12px;padding:12px 16px;font-size:13.5px;margin-bottom:18px">
    ⚠ Seu navegador está bloqueando o armazenamento local. Seus compromissos
    <b>não serão salvos</b> ao fechar a aba. Evite a janela anônima ou use outro navegador.
  </div>

  <header>
    <div class="brand">
      <h1>Minha Agenda</h1>
      <p id="todayLine">—</p>
    </div>
    <div class="actions">
      <button class="btn primary" id="addBtn">+ Novo</button>
      <button class="btn ghost sm" id="installBtn" hidden>Instalar</button>
      <button class="btn ghost sm" id="expBtn">Exportar</button>
      <button class="btn ghost sm" id="impBtn">Importar</button>
      <input type="file" id="impFile" accept=".json,application/json" hidden>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true"  data-view="agenda">Agenda</button>
    <button class="tab" role="tab" aria-selected="false" data-view="calendario">Calendário</button>
  </div>

  <div id="nextWrap"></div>

  <section id="view-agenda">
    <div class="filters">
      <input type="text" class="search" id="search" placeholder="Buscar por título, descrição ou categoria...">
      <button class="chip" id="showDone" aria-pressed="false">Concluídos</button>
    </div>
    <div id="agendaList"></div>
  </section>

  <section id="view-calendario" hidden>
    <div class="calbar">
      <h2 id="calTitle">—</h2>
      <div class="calnav">
        <button class="btn sm" id="calToday">Hoje</button>
        <button class="btn sm" id="calPrev">‹</button>
        <button class="btn sm" id="calNext">›</button>
      </div>
    </div>
    <div class="grid" id="calDow"></div>
    <div class="grid" id="calGrid"></div>
  </section>

</div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle">Novo compromisso</h3>
    <form id="form">
      <div class="field">
        <label for="fTitle">Título *</label>
        <input type="text" id="fTitle" placeholder="Ex.: Prova de matemática" required maxlength="120" autocomplete="off">
      </div>
      <div class="field">
        <label for="fDesc">Descrição</label>
        <textarea id="fDesc" placeholder="Ex.: Capítulos 4 e 5, sala 302" maxlength="600"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label for="fWhen">Data e hora *</label>
          <input type="datetime-local" id="fWhen" required>
        </div>
        <div class="field">
          <label for="fLoc">Local</label>
          <input type="text" id="fLoc" placeholder="Ex.: Escola" maxlength="80" autocomplete="off">
        </div>
      </div>
      <div class="field">
        <label>Categoria</label>
        <input type="text" id="fCat" placeholder="Ex.: Estudo" maxlength="30" autocomplete="off">
        <div class="presets" id="presets"></div>
      </div>
      <div class="modalfoot">
        <button type="button" class="btn ghost" id="cancelBtn">Cancelar</button>
        <button type="submit" class="btn primary" id="saveBtn">Salvar</button>
      </div>
    </form>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";

/* ================= Config ================= */
const STORE_KEY = "minha-agenda:v1";
const DOW = ["segunda","terça","quarta","quinta","sexta","sábado","domingo"];
const DOW_SHORT = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
const MONTHS = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const CATS = ["Estudo","Trabalho","Pessoal","Saúde","Financeiro","Lazer","Família","Outro"];
const PALETTE = ["#a78bfa","#22d3ee","#f472b6","#34d399","#fbbf24","#60a5fa","#fb923c","#c084fc"];

const LEVELS = {
  late : { c:"var(--c-late)",  label:"Atrasado" },
  crit : { c:"var(--c-crit)",  label:"Urgente"  },
  high : { c:"var(--c-high)",  label:"Atenção"  },
  med  : { c:"var(--c-med)",   label:"Em breve" },
  low  : { c:"var(--c-low)",   label:"Tranquilo" }
};

/* ================= Estado ================= */
let items   = [];
let view    = "agenda";
let query   = "";
let showDone= false;
let editing = null;
let calRef  = new Date();
let installPrompt = null;

/* ================= Utilidades ================= */
const $  = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));

const sameDay = (a, b) =>
  a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();

function dayKey(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function catColor(cat) {
  if (!cat) return "var(--muted)";
  let h = 0;
  for (const ch of cat.toLowerCase()) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return PALETTE[h % PALETTE.length];
}

function toLocalInput(d) {
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ================= Urgência ================= */
function urgency(item) {
  const when = new Date(item.when);
  const diff = when - Date.now();
  const abs  = Math.abs(diff);
  const mins = Math.round(abs / 60000);
  const hrs  = abs / 3600000;
  const days = Math.floor(abs / 86400000);

  let level, text;

  if (diff < -60000) {
    level = "late";
    text = mins < 60 ? `atrasado há ${mins} min`
        : hrs  < 48  ? `atrasado há ${Math.round(hrs)}h`
        :             `atrasado há ${days} ${days === 1 ? "dia" : "dias"}`;
  } else if (hrs < 1) {
    level = "crit";
    text = mins <= 0 ? "começa agora" : `faltam ${mins} min`;
  } else if (hrs < 24) {
    level = "crit";
    text = `faltam ${Math.round(hrs)}h`;
  } else if (hrs < 48) {
    level = "crit";
    text = `faltam 1 dia e ${Math.round(hrs - 24)}h`;
  } else if (days <= 3) {
    level = "high";
    text = `faltam ${days} ${days === 1 ? "dia" : "dias"}`;
  } else if (days <= 7) {
    level = "med";
    text = `faltam ${days} dias`;
  } else {
    level = "low";
    text = `faltam ${days} dias`;
  }

  return { level, text, c: LEVELS[level].c, when, diff, pulse: diff >= 0 && hrs < 24 };
}

function formatWhen(d) {
  const today = new Date(), tom = new Date(today);
  tom.setDate(tom.getDate() + 1);
  const time = `${pad(d.getHours())}h${pad(d.getMinutes())}`;
  if (sameDay(d, today)) return "Hoje";
  if (sameDay(d, tom))   return "Amanhã";
  return `${DOW_SHORT[(d.getDay() + 6) % 7]}, ${d.getDate()} de ${MONTHS[d.getMonth()].slice(0, 3)}`;
}

function groupTitle(d) {
  const today = new Date(), tom = new Date(today), yest = new Date(today);
  tom.setDate(tom.getDate() + 1);
  yest.setDate(yest.getDate() - 1);
  if (sameDay(d, today)) return "Hoje";
  if (sameDay(d, tom))   return "Amanhã";
  if (sameDay(d, yest))  return "Ontem";
  const full = `${DOW[(d.getDay() + 6) % 7]}, ${d.getDate()} de ${MONTHS[d.getMonth()]}`;
  return full.charAt(0).toUpperCase() + full.slice(1);
}

/* ================= Persistência ================= */
function storageOk() {
  try {
    localStorage.setItem("__probe", "1");
    localStorage.removeItem("__probe");
    return true;
  } catch { return false; }
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    items = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(items)) items = [];
  } catch { items = []; }
}

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(items));
  } catch {
    toast("Seu navegador bloqueou o armazenamento. Use o botão Exportar para não perder seus dados.");
  }
}

/* ================= Render: Próximo ================= */
function renderNext() {
  const wrap = $("#nextWrap");
  const pend = items.filter(i => !i.done).sort((a, b) => new Date(a.when) - new Date(b.when));

  if (!pend.length) { wrap.innerHTML = ""; return; }

  const late = pend.filter(i => urgency(i).level === "late");
  const next = late[0] || pend[0];
  const u    = urgency(next);

  wrap.innerHTML = `
    <div class="nextup" style="--u:${u.c}">
      <div class="ring">${late[0] ? "!" : "◷"}</div>
      <div class="body">
        <div class="lbl">${late[0] ? "Precisa de atenção" : "Próximo"}</div>
        <h3>${esc(next.title)}</h3>
        <p>${esc(formatWhen(u.when))} às ${pad(u.when.getHours())}h${pad(u.when.getMinutes())}${next.loc ? " · " + esc(next.loc) : ""}</p>
      </div>
      <div class="when">
        <b>${esc(u.text)}</b>
        <span>${esc(u.when.toLocaleDateString("pt-BR", { day:"2-digit", month:"2-digit", year:"2-digit" }))}</span>
      </div>
    </div>`;
}

/* ================= Render: Agenda ================= */
function visibleItems() {
  const q = query.trim().toLowerCase();
  return items
    .filter(i => showDone || !i.done)
    .filter(i => !q ||
      (i.title || "").toLowerCase().includes(q) ||
      (i.desc  || "").toLowerCase().includes(q) ||
      (i.cat   || "").toLowerCase().includes(q))
    .sort((a, b) => new Date(a.when) - new Date(b.when));
}

function itemHTML(i) {
  const u = urgency(i);
  const late = u.diff < 0;
  return `
  <div class="item ${i.done ? "done" : ""}" style="--u:${u.c}" data-id="${i.id}">
    <input type="checkbox" class="check" ${i.done ? "checked" : ""} data-act="done" title="Marcar como concluído">
    <div class="time">
      <b>${pad(u.when.getHours())}h</b>
      <span>${pad(u.when.getMinutes())}</span>
    </div>
    <div class="content">
      <div class="title">${esc(i.title)}</div>
      ${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ""}
      <div class="meta">
        <span class="badge ${u.pulse && !i.done ? "pulse" : ""}">${esc(u.text)}</span>
        ${i.cat ? `<span class="tag" style="--c:${catColor(i.cat)}">${esc(i.cat)}</span>` : ""}
        ${i.loc ? `<span class="loc">📍 ${esc(i.loc)}</span>` : ""}
      </div>
    </div>
    <div class="tools">
      <button class="tool" data-act="edit" title="Editar">✎</button>
      <button class="tool del" data-act="del" title="Excluir">🗑</button>
    </div>
  </div>`;
}

function renderAgenda() {
  const list = visibleItems();
  const box  = $("#agendaList");

  if (!list.length) {
    box.innerHTML = `
      <div class="empty">
        <div class="ico">🗓</div>
        <h3>${query ? "Nada encontrado" : "Sua agenda está vazia"}</h3>
        <p>${query ? "Tente outro termo de busca." : 'Clique em <b>+ Novo</b> para adicionar o primeiro compromisso.'}</p>
      </div>`;
    return;
  }

  const buckets = new Map();

  for (const i of list) {
    const d = new Date(i.when);
    const late = !i.done && urgency(i).level === "late";
    const k = late ? "__late__" : dayKey(d);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(i);
  }

  const keys = [...buckets.keys()];
  const lateKey = "__late__";
  keys.sort((a, b) => {
    if (a === lateKey) return -1;
    if (b === lateKey) return 1;
    return a < b ? -1 : a > b ? 1 : 0;
  });

  box.innerHTML = keys.map(k => {
    if (k === lateKey) {
      return `<div class="day"><div class="dayhead late">
        <h2>⚠ Atrasados</h2><span class="cnt">${buckets.get(k).length}</span>
      </div>${buckets.get(k).map(itemHTML).join("")}</div>`;
    }
    const d = new Date(k + "T00:00:00");
    const isToday = sameDay(d, new Date());
    return `<div class="day"><div class="dayhead ${isToday ? "today" : ""}">
      <h2>${esc(groupTitle(d))}</h2><span class="cnt">${buckets.get(k).length} ${buckets.get(k).length === 1 ? "item" : "itens"}</span>
    </div>${buckets.get(k).map(itemHTML).join("")}</div>`;
  }).join("");
}

/* ================= Render: Calendário ================= */
function renderCalendar() {
  const y = calRef.getFullYear(), m = calRef.getMonth();
  $("#calTitle").textContent = `${MONTHS[m]} de ${y}`;

  $("#calDow").innerHTML = DOW_SHORT.map(d => `<div class="dow">${d}</div>`).join("");

  const first = new Date(y, m, 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - offset);
  const today = new Date();

  const byDay = new Map();
  for (const i of items) {
    const k = dayKey(new Date(i.when));
    if (!byDay.has(k)) byDay.set(k, []);
    byDay.get(k).push(i);
  }

  let html = "";
  for (let n = 0; n < 42; n++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + n);
    const out = d.getMonth() !== m;
    const key = dayKey(d);
    const day = (byDay.get(key) || []).filter(i => !i.done).sort((a, b) => new Date(a.when) - new Date(b.when));

    const dots = day.slice(0, 5).map(i => {
      const u = urgency(i);
      return `<span class="dot" style="background:${u.c}"></span>`;
    }).join("");

    html += `
      <div class="cell ${out ? "out" : ""} ${sameDay(d, today) ? "today" : ""}" data-day="${key}">
        <span class="n">${d.getDate()}</span>
        <div class="dots">${dots}</div>
        ${day.length > 5 ? `<span class="more">+${day.length - 5}</span>` : ""}
      </div>`;
  }
  $("#calGrid").innerHTML = html;
}

/* ================= Render geral ================= */
function render() {
  const now = new Date();
  $("#todayLine").textContent = now.toLocaleDateString("pt-BR", {
    weekday: "long", day: "numeric", month: "long"
  });
  renderNext();
  if (view === "agenda") renderAgenda(); else renderCalendar();
}

/* ================= Modal ================= */
function switchView(v) {
  view = v;
  document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x.dataset.view === v));
  $("#view-agenda").hidden     = v !== "agenda";
  $("#view-calendario").hidden = v !== "calendario";
  render();
}

function openModal(item, whenDefault) {
  editing = item || null;
  $("#mTitle").textContent = item ? "Editar compromisso" : "Novo compromisso";
  $("#fTitle").value = item?.title || "";
  $("#fDesc").value  = item?.desc  || "";
  $("#fLoc").value   = item?.loc   || "";
  $("#fCat").value   = item?.cat   || "";

  if (item) {
    $("#fWhen").value = toLocalInput(new Date(item.when));
  } else if (whenDefault) {
    $("#fWhen").value = whenDefault;
  } else {
    const d = new Date(Date.now() + 3600000);
    d.setMinutes(0, 0, 0);
    $("#fWhen").value = toLocalInput(d);
  }

  syncPresets();
  $("#overlay").classList.add("on");
  setTimeout(() => $("#fTitle").focus(), 60);
}

function closeModal() {
  $("#overlay").classList.remove("on");
  editing = null;
  $("#form").reset();
}

function syncPresets() {
  const cur = $("#fCat").value.trim();
  $("#presets").innerHTML = CATS.map(c =>
    `<button type="button" class="preset" data-c="${esc(c)}" style="--c:${catColor(c)}" aria-pressed="${cur.toLowerCase() === c.toLowerCase()}">${esc(c)}</button>`
  ).join("");
}

/* ================= Toast ================= */
let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ================= Eventos ================= */
function init() {
  load();

  document.querySelectorAll(".tab").forEach(t => {
    t.addEventListener("click", () => switchView(t.dataset.view));
  });

  $("#addBtn").addEventListener("click", () => openModal(null));
  $("#cancelBtn").addEventListener("click", closeModal);
  $("#overlay").addEventListener("click", e => { if (e.target === $("#overlay")) closeModal(); });

  $("#installBtn").addEventListener("click", async () => {
    if (!installPrompt) return;
    installPrompt.prompt();
    const choice = await installPrompt.userChoice;
    installPrompt = null;
    $("#installBtn").hidden = true;
    toast(choice.outcome === "accepted" ? "Instalando o aplicativo..." : "Instalação cancelada");
  });

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    installPrompt = e;
    $("#installBtn").hidden = false;
  });

  window.addEventListener("appinstalled", () => {
    installPrompt = null;
    $("#installBtn").hidden = true;
    toast("Aplicativo instalado");
  });

  $("#presets").addEventListener("click", e => {
    const b = e.target.closest(".preset");
    if (!b) return;
    $("#fCat").value = $("#fCat").value.trim() === b.dataset.c ? "" : b.dataset.c;
    syncPresets();
  });
  $("#fCat").addEventListener("input", syncPresets);

  $("#form").addEventListener("submit", e => {
    e.preventDefault();
    const when = new Date($("#fWhen").value);
    if (isNaN(when)) { toast("Data inválida"); return; }

    const data = {
      title: $("#fTitle").value.trim(),
      desc:  $("#fDesc").value.trim(),
      loc:   $("#fLoc").value.trim(),
      cat:   $("#fCat").value.trim(),
      when:  when.toISOString()
    };
    if (!data.title) { toast("Informe um título"); return; }

    if (editing) Object.assign(editing, data);
    else items.push({ id: uid(), done: false, createdAt: new Date().toISOString(), ...data });

    save(); closeModal(); render();
    toast(editing ? "Compromisso atualizado" : "Compromisso adicionado");
  });

  $("#agendaList").addEventListener("click", e => {
    const row = e.target.closest(".item");
    if (!row) return;
    const item = items.find(i => i.id === row.dataset.id);
    if (!item) return;

    const act = e.target.closest("[data-act]");
    if (act) {
      const a = act.dataset.act;
      if (a === "del") {
        if (!confirm(`Excluir "${item.title}"?`)) return;
        items = items.filter(i => i.id !== item.id);
        save(); render(); toast("Excluído");
        return;
      }
      if (a === "done") {
        item.done = !item.done;
        save(); render();
        return;
      }
      if (a === "edit") { openModal(item); return; }
    }
    openModal(item);
  });

  $("#search").addEventListener("input", e => { query = e.target.value; renderAgenda(); });

  $("#showDone").addEventListener("click", e => {
    showDone = !showDone;
    e.currentTarget.setAttribute("aria-pressed", String(showDone));
    renderAgenda();
  });

  $("#calPrev").addEventListener("click", () => { calRef = new Date(calRef.getFullYear(), calRef.getMonth() - 1, 1); renderCalendar(); });
  $("#calNext").addEventListener("click", () => { calRef = new Date(calRef.getFullYear(), calRef.getMonth() + 1, 1); renderCalendar(); });
  $("#calToday").addEventListener("click", () => { calRef = new Date(); renderCalendar(); });

  $("#calGrid").addEventListener("click", e => {
    const c = e.target.closest(".cell");
    if (!c) return;
    const day = c.dataset.day;
    switchView("agenda");
    openModal(null, `${day}T09:00`);
  });

  $("#expBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify({ app:"minha-agenda", version:1, exportedAt:new Date().toISOString(), items }, null, 2)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `minha-agenda-${dayKey(new Date())}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    toast("Backup exportado");
  });

  $("#impBtn").addEventListener("click", () => $("#impFile").click());
  $("#impFile").addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const incoming = Array.isArray(d) ? d : d.items;
        if (!Array.isArray(incoming)) throw 0;
        if (incoming.length && !confirm(`Importar ${incoming.length} compromissos? Os atuais serão substituídos.`)) return;
        items = incoming.map(i => ({
          id: i.id || uid(),
          title: i.title || "Sem título",
          desc: i.desc || "", loc: i.loc || "", cat: i.cat || "",
          when: i.when || new Date().toISOString(),
          done: !!i.done,
          createdAt: i.createdAt || new Date().toISOString()
        }));
        save(); render(); toast("Importado com sucesso");
      } catch {
        toast("Arquivo inválido");
      }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && $("#overlay").classList.contains("on")) closeModal();
    if (e.key === "n" && !/input|textarea|select/i.test(e.target.tagName) && !$("#overlay").classList.contains("on")) {
      e.preventDefault(); openModal(null);
    }
  });

  setInterval(render, 60000);
  if (!storageOk()) $("#storageWarn").hidden = false;
  render();
}

function registerServiceWorker() {
  if (!("serviceWorker" in navigator) || location.protocol === "file:") return;

  const register = () => {
    navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" })
      .then(registration => {
        registration.addEventListener("updatefound", () => {
          const worker = registration.installing;
          if (!worker) return;
          worker.addEventListener("statechange", () => {
            if (worker.state === "installed" && navigator.serviceWorker.controller) {
              toast("Nova versão disponível. Feche e abra o app para atualizar.");
            }
          });
        });
      })
      .catch(() => {});
  };

  if (document.readyState === "complete") register();
  else window.addEventListener("load", register, { once: true });
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

registerServiceWorker();
</script>
</body>
</html>
